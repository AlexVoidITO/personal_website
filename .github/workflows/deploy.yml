name: Deploy to Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH key from base64
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /home/personal/personal_website
            git fetch --all
            git reset --hard origin/main
            docker compose down
            if command -v rsync &> /dev/null; then
                rsync -av --delete public/ /var/www/voidsite/public/
            else
                cp -rf public/* /var/www/voidsite/public/
            fi
            docker compose up -d --build
            sudo systemctl reload nginx.service || true
            echo "Проверка статуса контейнеров:"
            docker ps
            echo "Проверка веб-сервера (порт 80)..."
            curl -fsS -o /dev/null http://localhost || exit 1
            echo "Веб-сервер в норме"
          EOF