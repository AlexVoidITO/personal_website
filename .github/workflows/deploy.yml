name: Deploy to Server

on:
  push:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Check SSH key
        run: |
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH key is not empty"
          else
            echo "SSH key is empty!"
            exit 1
          fi


      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no -p ${{ secrets.SERVER_PORT }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e  


            cd /home/personal/personal_website

            git fetch --all
            git reset --hard origin/main

            docker compose down


            if command -v rsync &> /dev/null; then
                rsync -av --delete public/ /var/www/voidsite/public/
            else
                cp -rf public/* /var/www/voidsite/public/
            fi


            docker compose up -d --build


            sudo systemctl reload nginx.service || true


            echo "Проверка статуса контейнеров:"
            docker ps


            echo "Проверка веб-сервера (порт 80)..."
            curl -fsS -o /dev/null http://localhost || exit 1
            echo "Веб-сервер в норме"

          EOF